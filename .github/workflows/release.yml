name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # GitHub ubuntu-latest runner 已预装 Android SDK 并接受许可证，
      # 缺失的 platform/build-tools 由 AGP 自动下载。

      # 签名凭据不进仓库：keystore 与密钥轮换谱系存于仓库 Secrets（base64）。
      - name: Decode signing assets
        run: |
          echo "${{ secrets.SIGNING_KEYSTORE2_B64 }}" | base64 -d > "$RUNNER_TEMP/v2.jks"
          echo "${{ secrets.SIGNING_LINEAGE_GZ_B64 }}" | base64 -d | gunzip > "$RUNNER_TEMP/lineage"

      - name: Build release APK
        env:
          SIGNING_STORE_FILE: ${{ runner.temp }}/v2.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: suitanglu-v2
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon

      # 用 v3 密钥轮换谱系重签（需同时提供新旧签名者）：泄露的旧密钥从此无法覆盖已升级用户
      - name: Apply key lineage
        env:
          KS_PASS: ${{ secrets.SIGNING_STORE_PASSWORD }}
        run: |
          echo "${{ secrets.SIGNING_OLD_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/old.jks"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -p 4 \
            app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/aligned.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/old.jks" --ks-key-alias suitanglu \
            --ks-pass pass:suitanglu2026 --key-pass pass:suitanglu2026 \
            --next-signer \
            --ks "$RUNNER_TEMP/v2.jks" --ks-key-alias suitanglu-v2 \
            --ks-pass "env:KS_PASS" --key-pass "env:KS_PASS" \
            --lineage "$RUNNER_TEMP/lineage" \
            --min-sdk-version 29 --rotation-min-sdk-version 29 --v1-signing-enabled false \
            --out "record-${GITHUB_REF_NAME}.apk" "$RUNNER_TEMP/aligned.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "record-${GITHUB_REF_NAME}.apk"

      - name: Extract version
        id: ver
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          [ "$TAG" = "${GITHUB_REF_NAME}" ] && TAG="${GITHUB_REF_NAME}"
          echo "version=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create Release and upload APK
        uses: softprops/action-gh-release@v2
        with:
          name: 随堂录 v${{ steps.ver.outputs.version }}
          body: |
            自动构建的发布版本。

            请下载 `record-${{ github.ref_name }}.apk` 安装。
          files: record-${{ github.ref_name }}.apk
          draft: false
          prerelease: false
